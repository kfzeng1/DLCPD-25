seed: 20260809
data_root: ../data/raw/dlcpd25-203
taxonomy: ../artifacts/data/v1/d5-r1/taxonomy-v1.json
split_dir: ../artifacts/data/v1/d3-r2
output_dir: ../artifacts/training
initial_checkpoint: ../artifacts/releases/dlcpd25-resnet50-weighted-v1/best.pt

model:
  name: resnet50
  num_classes: 203
  image_size: 224

training:
  epochs: 5
  warmup_epochs: 1
  batch_size: 128
  workers: 6
  amp: true
  optimizer: adamw
  learning_rate: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.1
  class_weighting: inverse_frequency_clipped_at_10_then_mean_normalized
  early_stopping_patience: 3

evaluation:
  selection_metric: val_macro_f1
  top1_drop_limit_percentage_points: 3.0
  test_metrics_read: false

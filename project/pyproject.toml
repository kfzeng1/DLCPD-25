[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlcpd25-plan-a"
version = "0.1.0"
description = "DLCPD-25 classification + IP102 detection, Plan-A two-model architecture"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0",
    "pyyaml>=6.0",
    "torch>=2.1",
    "torchvision>=0.16",
]

[project.optional-dependencies]
app = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
